[project]
name = "poc-base"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.39.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.6.9", "mypy>=1.11.2", "pytest>=8.3.0", "pytest-cov>=5.0.0", "pre-commit>=3.8.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
strict = true